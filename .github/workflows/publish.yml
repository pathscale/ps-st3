name: Publish

# Publishing is irreversible: a version can never be reused and yanking does not
# delete. The guard is crates.io itself rather than a diff against the previous
# commit, so it survives a squash merge, does not need a bump to make the first
# release, and cannot double-publish if it runs twice.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - id: version
        run: |
          name=$(sed -nE '0,/^name = "(.*)"/s//\1/p' Cargo.toml)
          version=$(sed -nE '0,/^version = "(.*)"/s//\1/p' Cargo.toml)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "$name-release-workflow" \
            "https://crates.io/api/v1/crates/$name/$version")
          if [ "$code" = "200" ]; then
            echo "$name $version is already on crates.io, nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name $version is not on crates.io (HTTP $code), publishing"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # The gate runs on this commit too, but a release must not depend on job
      # ordering, so it is re-run here rather than assumed.
      - if: steps.version.outputs.publish == 'true'
        run: cargo test --release

      - if: steps.version.outputs.publish == 'true'
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - if: steps.version.outputs.publish == 'true'
        run: |
          tag="v${{ steps.version.outputs.version }}"
          git tag "$tag"
          git push origin "$tag"
