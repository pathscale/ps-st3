[package]
name = "ps-st3"
# When incrementing version and releasing to crates.io:
# - Update crate version in README.md
# - Update CHANGELOG.md
# - Update if necessary copyright notice in LICENSE-MIT
# - Create a "vX.Y.Z" git tag
version = "0.6.3"
authors = ["Serge Barral <serge.barral@asynchronics.com>"]
edition = "2021"
rust-version = "1.60"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pathscale/st3"
readme = "README.md"
description = """
A very fast lock-free, bounded, work-stealing LIFO queue.
"""
categories = ["concurrency", "data-structures"]
keywords = ["queue", "stack", "bounded", "lock-free", "work-stealing"]
autotests = false
autobenches = false

[lib]
# The crate is renamed but the library is not, so `use st3::...` and the
# `st3_loom` cfg both keep working unchanged against the fork.
name = "st3"

[dependencies]
# The `host` parker. A condition variable costs a mutex on every wake, and this
# pool's wakes are its hot path; `atomic-wait` is a futex on Linux, `WaitOnAddress`
# on Windows and `__ulock_wait` on macOS, so an uncontended park or unpark is one
# atomic and, when nobody has to sleep, no system call at all.
atomic-wait = { version = "1.1", optional = true }

[features]
default = ["fanout"]

# The no_std work-stealing pool built on these queues. It has no queue or lock
# dependencies; the pool takes its OS behavior from a caller-supplied Host.
fanout = []

# The OS substrate for `fanout`: threads, parking, a clock. The pool itself is
# `no_std` and knows nothing about any of it, so a target without an OS links
# the pool alone and brings its own `Host`.
#
# **This feature has a higher minimum than the crate.** `rust-version` above is
# 1.60 and holds for the queues and for `fanout`. `host` pulls `atomic-wait`,
# which on Linux, Android and FreeBSD depends on `libc`, and `libc` 0.2.189
# requires **1.65**. macOS and Windows do not pull it. CI checks 1.60 without
# this feature for that reason.
host = ["atomic-host"]

# OS blocking waits without Rust std. The caller supplies a monotonic clock
# and worker lifecycle. Like `host`, supported platforms come from atomic-wait
# and its libc dependency can require a newer compiler than the portable core.
atomic-host = ["fanout", "dep:atomic-wait"]

[dev-dependencies]
criterion = "0.3"
oorandom = "11.1"
crossbeam-deque = "0.8"
num_cpus = "1.13"
# Only the floor example needs it: the std parallel option to measure against.
orx-parallel = { version = "3.4", default-features = false, features = ["std"] }

[target.'cfg(st3_loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(st3_loom)'] }

[[bench]]
name = "benchmark"
path = "benches/benchmark.rs"
harness = false

[[test]]
name = "integration"
path = "tests/tests.rs"

[[test]]
name = "fanout"
path = "tests/fanout.rs"
required-features = ["host"]

[[test]]
name = "atomic-host"
path = "tests/atomic_host.rs"
required-features = ["atomic-host"]

[[example]]
name = "floor"
path = "examples/floor.rs"
required-features = ["host"]

[[example]]
name = "fanout_stress"
path = "examples/fanout_stress.rs"
required-features = ["host"]

[[example]]
name = "fanout_throughput"
path = "examples/fanout_throughput.rs"
required-features = ["host"]
